name: Build APK, Web and Desktop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: xournalpp-mobile-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # the legacy web folder predates Flutter 2; regenerate it
      - run: rm -rf web && flutter create --platforms=web .
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: xournalpp-mobile-web
          path: build/web

  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # the legacy windows folder came from another toolchain; regenerate it
      - run: Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
        shell: pwsh
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: xournalpp-mobile-windows
          path: build/windows/x64/runner/Release

  linux:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: rm -rf linux && flutter create --platforms=linux .
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: xournalpp-mobile-linux
          path: build/linux/x64/release/bundle
