name: xournalpp
description: A modernized port of the main features of Xournal++ to Android, Windows, Linux and the Web.

publish_to: none

version: 2.0.0+30

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: '>=0.18.0 <0.30.0'
  archive: ^4.0.4
  xml: ^6.5.0
  url_launcher: ^6.3.1
  transparent_image: ^2.0.1
  after_layout: ^1.2.0
  shared_preferences: ^2.5.3
  vector_math: ^2.1.4
  flutter_colorpicker: ^1.1.0
  package_info_plus: '>=8.0.0 <12.0.0'
  printing: ^5.14.2
  pdf: ^3.11.3
  file_picker: ^12.0.0-beta.5
  path_provider: ^2.1.5
  desktop_drop: ^0.7.1
  dynamic_color: ^1.8.1
  font_awesome_flutter: ^11.0.0
  perfect_freehand: ^2.5.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Open Sans
      fonts:
        - asset: fonts/Open Sans/OpenSans-Regular.ttf
        - asset: fonts/Open Sans/OpenSans-Light.ttf
          weight: 300
        - asset: fonts/Open Sans/OpenSans-ExtraBold.ttf
          weight: 800
    - family: Glacial Indifference
      fonts:
        - asset: fonts/Glacial Indifference/GlacialIndifference-Regular.otf
