name: xournalpp
description: Tenerumi - Appunti, disegno e annotazioni PDF compatibili con Xournal++.

publish_to: none

version: 0.5.0+31

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.20.3
  archive: ^4.3.0
  xml: ^7.0.1
  url_launcher: ^6.3.1
  transparent_image: ^2.0.1
  shared_preferences: ^2.5.3
  vector_math: ^2.4.3
  flutter_colorpicker: ^1.1.0
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  desktop_drop: ^0.8.4
  dynamic_color: ^2.1.0
  material_ui: ^1.5.0
  font_awesome_flutter: ^11.0.0
  pdfx:
    path: packages/pdfx
  flutter_math_fork: ^0.7.4
  http: ^1.6.0
  crypto: ^3.0.7
  web: ^1.1.1
dependency_overrides:
  android_file_picker:
    path: packages/android_file_picker

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: VT323
      fonts:
        - asset: fonts/VT323/VT323-Regular.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter/Inter-Variable.ttf
    - family: Open Sans
      fonts:
        - asset: fonts/Open Sans/OpenSans-Regular.ttf
        - asset: fonts/Open Sans/OpenSans-Light.ttf
          weight: 300
        - asset: fonts/Open Sans/OpenSans-ExtraBold.ttf
          weight: 800
    - family: Glacial Indifference
      fonts:
        - asset: fonts/Glacial Indifference/GlacialIndifference-Regular.otf
