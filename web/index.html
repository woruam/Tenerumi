<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OSI notes and PDF annotations">
  <title>OSI</title>
</head>
<body>
  <script type="module">
    try {
    const pdfjsLib = await import('./vendor/pdfjs/pdf.min.mjs');
    globalThis.pdfjsLib = pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';
    globalThis.pdfRenderOptions = {cMapUrl: './vendor/pdfjs/cmaps/', cMapPacked: true};
    } catch (error) { console.error('PDF non disponibile', error); }
    const bootstrap = document.createElement('script');
    bootstrap.src = 'flutter_bootstrap.js';
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
