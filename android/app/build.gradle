plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "30"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "2.0.0"
def releaseKeys = new Properties()
def releaseKeysFile = rootProject.file('key.properties')
if (releaseKeysFile.exists()) releaseKeysFile.withInputStream { releaseKeys.load(it) }
def signingValue = { name -> System.getenv('OSIPP_RELEASE_' + name.toUpperCase()) ?: releaseKeys.getProperty(name) }
def releaseStore = signingValue('storeFile')
def releaseConfigured = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword', 'certSha256'].every { signingValue(it) }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !releaseConfigured) {
        throw new GradleException('Firma release non configurata: serve una chiave di produzione e il certificato SHA-256 atteso. Nessun fallback debug.')
    }
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && releaseConfigured) {
        def keyStore = java.security.KeyStore.getInstance(file(releaseStore), signingValue('storePassword').toCharArray())
        def certificate = keyStore.getCertificate(signingValue('keyAlias'))
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        def expected = signingValue('certSha256').replaceAll('[^a-fA-F0-9]', '').toLowerCase()
        if (actual != expected || certificate.subjectX500Principal.name.contains('Android Debug')) {
            throw new GradleException('Certificato release inatteso o di debug: build bloccata.')
        }
    }
}

android {
	ndkVersion = "28.2.13676358"
    namespace "online.xournal.mobile"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "online.xournal.mobile"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (releaseConfigured) {
            production {
                storeFile file(releaseStore)
                storePassword signingValue('storePassword')
                keyAlias signingValue('keyAlias')
                keyPassword signingValue('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseConfigured) signingConfig signingConfigs.production
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "com.google.mlkit:text-recognition:16.0.1"
    testImplementation "junit:junit:4.13.2"
}
